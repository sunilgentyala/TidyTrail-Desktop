# cargo-deny policy: run in CI on every push/PR (see .github/workflows/ci.yml)
# and locally with `cargo deny check`.

[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
# Any known vulnerability (RustSec "vulnerability" advisory) fails the build.
# Only these "unmaintained" notices are accepted, because they are pulled in
# transitively by Tauri itself (tauri-utils -> urlpattern -> unic-*, and the
# GTK3 bindings' proc-macro helpers on Linux), not by TidyTrail, and none of
# them reports a vulnerability. Re-review whenever Tauri is upgraded.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time proc macro via Tauri's GTK3 stack; unmaintained, no known vulnerability" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range: transitive via tauri-utils/urlpattern; unmaintained, no known vulnerability" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common: transitive via tauri-utils/urlpattern; unmaintained, no known vulnerability" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property: transitive via tauri-utils/urlpattern; unmaintained, no known vulnerability" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: transitive via tauri-utils/urlpattern; unmaintained, no known vulnerability" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: transitive via tauri-utils/urlpattern; unmaintained, no known vulnerability" },
]

[licenses]
# Permissive licenses only; anything copyleft or unknown fails the build.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
# Tauri's dependency tree legitimately carries several versions of the
# windows-* crates, which is outside this project's control.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
