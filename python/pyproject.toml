[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "tidytrail"
description = "Fast, safe disk-usage scanning and audited cleanup for servers, from Python or the command line."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sunil Gentyala" }]
keywords = ["disk-usage", "cleanup", "du", "storage", "sysadmin", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: System :: Filesystems",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tidytrail = "tidytrail.cli:main"

[project.urls]
Homepage = "https://github.com/sunilgentyala/TidyTrail-Desktop/tree/main/python"
Source = "https://github.com/sunilgentyala/TidyTrail-Desktop"
Issues = "https://github.com/sunilgentyala/TidyTrail-Desktop/issues"
Changelog = "https://github.com/sunilgentyala/TidyTrail-Desktop/blob/main/CHANGELOG.md"
Security = "https://github.com/sunilgentyala/TidyTrail-Desktop/blob/main/SECURITY.md"

[tool.maturin]
module-name = "tidytrail._native"
python-packages = ["tidytrail"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
