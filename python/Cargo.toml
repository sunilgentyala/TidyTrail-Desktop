[package]
name = "tidytrail-python"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Python bindings (PyO3) for tidytrail-core: the tidytrail package on PyPI."

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
tidytrail-core = { path = "../core" }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
