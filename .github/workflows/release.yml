name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: cargo test (workspace)
        run: cargo test --workspace --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "TidyTrail Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-latest' && '--bundles deb,appimage' || '--bundles msi,nsis' }}

      # The compiled exe already has the whole frontend embedded (verified
      # by copying just this file to an empty folder and running it), so no
      # installer is required on Windows: zip it up as a no-install option
      # alongside the .msi/.exe installers. Linux's .AppImage from the step
      # above is already the portable format there, so it needs no extra step.
      - name: Package portable Windows build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dest = "TidyTrail-Desktop-${{ github.ref_name }}-portable-windows-x64"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item target/release/tidytrail-desktop.exe $dest/
          Copy-Item README.md $dest/
          Copy-Item LICENSE $dest/
          Compress-Archive -Path "$dest/*" -DestinationPath "$dest.zip"

      - name: Upload portable Windows build to release
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} "TidyTrail-Desktop-${{ github.ref_name }}-portable-windows-x64.zip" --clobber
