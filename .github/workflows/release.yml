name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Read-only by default; the build job below asks for exactly what it needs.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # sign build-provenance attestations (Sigstore)
      attestations: write
    env:
      # Passed through the environment, never interpolated into scripts.
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # No build cache on release builds: a poisoned cache from another
      # workflow run must not be able to end up inside a shipped binary.

      - name: cargo test (workspace)
        run: cargo test --workspace --locked

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "TidyTrail Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-latest' && '--bundles deb,appimage' || '--bundles msi,nsis' }}

      # The compiled exe already has the whole frontend embedded (verified
      # by copying just this file to an empty folder and running it), so no
      # installer is required on Windows: zip it up as a no-install option
      # alongside the .msi/.exe installers. Linux's .AppImage from the step
      # above is already the portable format there, so it needs no extra step.
      - name: Package portable Windows build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dest = "TidyTrail-Desktop-$env:TAG_NAME-portable-windows-x64"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item target/release/tidytrail-desktop.exe $dest/
          Copy-Item README.md $dest/
          Copy-Item LICENSE $dest/
          Compress-Archive -Path "$dest/*" -DestinationPath "$dest.zip"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Move-Item "$dest.zip" dist/
          Copy-Item target/release/bundle/msi/*.msi dist/
          Copy-Item target/release/bundle/nsis/*.exe dist/

      - name: Collect Linux artifacts
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp target/release/bundle/deb/*.deb dist/
          cp target/release/bundle/appimage/*.AppImage dist/

      # SHA-256 checksums so anyone installing on a server can verify the
      # download before running it (see SECURITY.md for the steps).
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum * > "../SHA256SUMS-${RUNNER_OS}.txt"
          cat "../SHA256SUMS-${RUNNER_OS}.txt"

      # Signed SLSA build-provenance attestation for every shipped file,
      # verifiable with `gh attestation verify <file> --repo <owner/repo>`.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Upload portable build and checksums to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=("SHA256SUMS-${RUNNER_OS}.txt")
          if [ "$RUNNER_OS" = "Windows" ]; then
            files+=(dist/TidyTrail-Desktop-*-portable-windows-x64.zip)
          fi
          gh release upload "$TAG_NAME" "${files[@]}" --clobber
