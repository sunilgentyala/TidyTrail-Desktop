version: 2
# Everything is grouped: at most one PR per ecosystem per month, instead of
# one PR (and branch) per dependency.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
